<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <title>Document</title>
</head>
<body>

    <section class="bg-black pb-20">
    <div class="text-white mx-20">
        <p class="pt-10 gap-10 text-blue-600 text-4xl">Create an account </p>
        <p>Already have an account? <button class="text-green-700 hover:text-blue-600"> Log in</button></p>
    </div>

    <div class="grid grid-cols-2 gap-10 mt-10 mx-20">
        <input type="text" placeholder="usrname" class="bg-white py-3 text-center rounded-md">
        <input type="text" placeholder="name" class="bg-white text-center rounded-md">
    </div>

    <div class="mt-10 px-20">
        <input type="text"placeholder="Email" class="bg-white w-full pl-5 rounded-md py-3">
    </div>

    <div class="mt-10 px-20">
     <input type="text" placeholder="Enter Your Password" class="bg-white w-full pl-5 rounded-md py-3">
    </div>
    <div class="mt-10 px-20 text-white flex">
        <input type="checkbox">
        <p>agree to the <a href="&&" class="text-blue-600 hover:text-white ">tearms & condition </a></p>
    </div>

    <div class="mt-10 px-20 text-white">
        <input type="text"placeholder="Create account" class="bg-blue-600 w-full text-center font-bold text-2xl rounded-md py-3">
    </div>

    <div class="mt-10 text-white text-center">
        <p>Or register with</p> 
    </div>
    
    <div class="grid grid-cols-2 mx-60 gap-10 mt-10 text-2xl">
      <button class="bg-white py-3 rounded-md" >Google</button>
      <button class="bg-white py-3 rounded-md">Apple</button>
    </div>

    </section>
</body>
</html>
